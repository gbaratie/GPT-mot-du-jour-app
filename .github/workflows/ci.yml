name: CI

on:
  push:
    branches: [main, Main-refacto]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: daily
          POSTGRES_PASSWORD: daily-ci
          POSTGRES_DB: daily_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U daily -d daily_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://daily:daily-ci@localhost:5432/daily_test
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_BASE_PATH: /GPT-mot-du-jour-app
      NEXT_PUBLIC_API_URL: https://api.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: make install
      - run: make schemas && git diff --exit-code -- content/schemas
      - run: make check
      - run: make test
      - run: make build
