name: Deploy web to GitHub Pages

on:
  push:
    branches: [main, Main-refacto]
  workflow_dispatch:
    inputs:
      api_url:
        description: URL HTTPS de l'API (sinon variable NEXT_PUBLIC_API_URL du dépôt)
        required: false
        type: string
      base_path:
        description: Chemin public du site (/ pour la racine)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.NEXT_PUBLIC_API_URL != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    env:
      NEXT_PUBLIC_API_URL: ${{ inputs.api_url || vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_BASE_PATH: ${{ inputs.base_path || vars.NEXT_PUBLIC_BASE_PATH || format('/{0}', github.event.repository.name) }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify production API URL
        run: |
          node -e 'const u = new URL(process.env.NEXT_PUBLIC_API_URL); if(u.protocol !== "https:" || ["localhost", "127.0.0.1"].includes(u.hostname)) throw new Error("Configure NEXT_PUBLIC_API_URL with the deployed HTTPS API URL");'
      - run: python -m pip install -e './apps/api[dev]'
      - run: python -m app.content validate
      - run: npm ci
      - run: npm run typecheck --workspace apps/web && npm run lint --workspace apps/web && npm test
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
