name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_url:
        description: URL HTTPS de l'API (sinon variable NEXT_PUBLIC_API_URL du dépôt)
        required: false
        type: string
      base_path:
        description: Chemin public du site (/ pour la racine)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    env:
      NEXT_PUBLIC_API_URL: ${{ inputs.api_url || vars.NEXT_PUBLIC_API_URL || 'https://daily-collections-api.onrender.com' }}
      NEXT_PUBLIC_BASE_PATH: ${{ inputs.base_path || vars.NEXT_PUBLIC_BASE_PATH || format('/{0}', github.event.repository.name) }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify production API URL
        run: |
          node -e 'const u = new URL(process.env.NEXT_PUBLIC_API_URL); if(u.protocol !== "https:" || ["localhost", "127.0.0.1"].includes(u.hostname)) throw new Error("Configure NEXT_PUBLIC_API_URL with the deployed HTTPS API URL");'
      - run: python -m pip install -e './apps/api[dev]'
      - run: python -m app.content validate
      - run: npm ci
      - run: npm run typecheck --workspace apps/web && npm run lint --workspace apps/web && npm test
      - name: Verify deployed API and CORS
        run: python scripts/check_deployment.py --api-url "$NEXT_PUBLIC_API_URL" --origin "https://${{ github.repository_owner }}.github.io"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{status, build_type, html_url, source, https_enforced}'
          test "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)" = workflow
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Diagnose failed Pages publication
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{status, build_type, html_url, source}'
          gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$GITHUB_SHA" --jq '{status, error}'
      - name: Verify published application
        env:
          DEPLOY_API_URL: ${{ inputs.api_url || vars.NEXT_PUBLIC_API_URL || 'https://daily-collections-api.onrender.com' }}
          WEB_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/check_deployment.py --api-url "$DEPLOY_API_URL" --web-url "$WEB_URL"
